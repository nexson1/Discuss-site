<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Discuss</title>

    {{ bootstrap.load_css() }}

    <link rel="icon" type="image/x-icon"
          href="{{ url_for('static', filename='assets/favicon.ico') }}">

    <link href="https://fonts.googleapis.com/css?family=Lora:400,700,400italic,700italic"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300italic,400italic,600italic,700italic,800italic"
          rel="stylesheet">

    <link href="{{ url_for('static', filename='css/styles.css') }}"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light" id="mainNav">
    <div class="container px-3 px-lg-5">

        <a class="navbar-brand"
           href="{{ url_for('home_page') if current_user.is_authenticated else url_for('landing_page') }}">
            Discuss
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                {% if current_user.is_authenticated %}

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home_page') }}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('about') }}">About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('logout') }}">Log Out</a>
                    </li>

                {% else %}

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('landing_page') }}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('register_user') }}">Register</a>
                    </li>

                {% endif %}

            </ul>
        </div>
    </div>
</nav>
